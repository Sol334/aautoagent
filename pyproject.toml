[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"

[tool.ruff.lint]
# Mirror the Sol334/galactic-system rule set: real-bug checks only.
# E402/E401 are intentionally excluded — scripts use the sys.path-insert-before-import
# pattern to resolve sibling packages.
select = ["E9", "F63", "F7", "F82", "F401", "F541", "F811", "F821", "F841"]
